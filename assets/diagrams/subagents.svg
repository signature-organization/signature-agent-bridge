<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title description"><title id="title">A subagent belongs to its parent Claude job.</title><desc id="description">The bridge starts and controls a parent Claude process. Claude delegates to named subagents and reports their task events. Clients control the parent job.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#14756d" stroke-width="1.4"/></marker></defs><rect width="1440" height="880" rx="20" fill="#f7f9fa"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="46" font-size="15" fill="#14756d" font-weight="600">Signature Agent Bridge / Operator guides</text><text x="44" y="96" font-size="32" fill="#203238" font-weight="600">A subagent belongs to its parent Claude job.</text><text x="44" y="132" font-size="18" fill="#657780" font-weight="400">Configure the profile once, explicitly request delegation, then observe the native task events.</text><rect x="44" y="206" width="350" height="288" rx="15" fill="#eef3f7" stroke="#d5e2e5"/><text x="68" y="243" font-size="21" fill="#203238" font-weight="600">Signature Agent Bridge</text><text x="68" y="280" font-size="16" fill="#657780" font-weight="400">Admit the job and claim its attempt.</text><text x="68" y="307" font-size="16" fill="#657780" font-weight="400">Select profile: code-workflow.</text><text x="68" y="334" font-size="16" fill="#657780" font-weight="400">Pass Agent and named definitions.</text><text x="68" y="361" font-size="16" fill="#657780" font-weight="400">Record native child-task events.</text><text x="68" y="388" font-size="16" fill="#657780" font-weight="400">Expose status through API/SSE</text><text x="68" y="415" font-size="16" fill="#657780" font-weight="400">and the console's Child tasks.</text><rect x="494" y="206" width="416" height="288" rx="15" fill="#e8f3ee" stroke="#d5e2e5"/><text x="518" y="243" font-size="21" fill="#203238" font-weight="600">Parent Claude Code process</text><text x="518" y="280" font-size="16" fill="#657780" font-weight="400">Read the job's prompt.</text><text x="518" y="307" font-size="16" fill="#657780" font-weight="400">Use Agent to delegate scoped work.</text><text x="518" y="334" font-size="16" fill="#657780" font-weight="400">Receive each specialist's findings.</text><text x="518" y="361" font-size="16" fill="#657780" font-weight="400">Continue the main task.</text><text x="518" y="388" font-size="16" fill="#657780" font-weight="400">Own the execution's tool calls</text><text x="518" y="415" font-size="16" fill="#657780" font-weight="400">and native conversation context.</text><rect x="1010" y="206" width="386" height="132" rx="15" fill="#f6eee7" stroke="#d5e2e5"/><text x="1034" y="243" font-size="21" fill="#203238" font-weight="600">planner</text><text x="1034" y="280" font-size="16" fill="#657780" font-weight="400">Read / Glob / Grep</text><text x="1034" y="307" font-size="16" fill="#657780" font-weight="400">Inspect the project; return a plan.</text><rect x="1010" y="374" width="386" height="132" rx="15" fill="#f6eee7" stroke="#d5e2e5"/><text x="1034" y="411" font-size="21" fill="#203238" font-weight="600">reviewer</text><text x="1034" y="448" font-size="16" fill="#657780" font-weight="400">Read / Glob / Grep</text><text x="1034" y="475" font-size="16" fill="#657780" font-weight="400">Inspect changes; report defects.</text><path d="M394 316H490" stroke="#14756d" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="413" y="295" font-size="14" fill="#14756d" font-weight="600">Dispatch</text><path d="M910 267H1006" stroke="#14756d" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="939" y="247" font-size="14" fill="#14756d" font-weight="600">Agent</text><path d="M910 429H1006" stroke="#14756d" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="939" y="409" font-size="14" fill="#14756d" font-weight="600">Agent</text><rect x="44" y="584" width="652" height="168" rx="15" fill="#fff" stroke="#d5e2e5"/><text x="68" y="621" font-size="21" fill="#203238" font-weight="600">How to launch</text><text x="68" y="658" font-size="16" fill="#657780" font-weight="400">Claude: bridge_submit with profile code-workflow.</text><text x="68" y="685" font-size="16" fill="#657780" font-weight="400">Console: New job → code-workflow → automatic worker.</text><text x="68" y="712" font-size="16" fill="#657780" font-weight="400">API: /v1/chat/completions · bridge.execution = agent</text><rect x="744" y="584" width="652" height="168" rx="15" fill="#fff" stroke="#d5e2e5"/><text x="768" y="621" font-size="21" fill="#203238" font-weight="600">How to control</text><text x="768" y="658" font-size="16" fill="#657780" font-weight="400">Pause or cancel the parent job and its owned process tree.</text><text x="768" y="685" font-size="16" fill="#657780" font-weight="400">Child tasks use native task IDs, not separate bridge jobs.</text><text x="768" y="712" font-size="16" fill="#657780" font-weight="400">No independent child pause/resume endpoint is exposed.</text><text x="44" y="798" font-size="17" fill="#14756d" font-weight="600">Example prompt: Use Agent to delegate a read-only project review to reviewer. Return findings with paths and evidence.</text><path d="M44 828H1396" stroke="#dbe6e7"/><text x="44" y="854" font-size="12" fill="#657780" font-weight="400">Signature Management Consultants SLU · Apache 2.0</text></g></svg>
