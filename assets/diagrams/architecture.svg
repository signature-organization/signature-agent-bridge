<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1152" viewBox="0 0 1440 1152" role="img" aria-labelledby="title description"><title id="title">One API. Three clear responsibilities.</title><desc id="description">The client owns its functions. The bridge owns orchestration. Claude owns model execution and native context.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto-start-reverse"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#14756d" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1440" height="1152" rx="20" fill="#f6f9fa" stroke="#f6f9fa"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="44" font-size="14" fill="#14756d" font-weight="600">SIGNATURE AGENT BRIDGE / SYSTEM DESIGN</text><text x="44" y="91" font-size="33" fill="#203238" font-weight="600">One API. Three clear responsibilities.</text><text x="44" y="128" font-size="18" fill="#63767d" font-weight="400">The client owns its functions. The bridge owns orchestration. Claude owns model execution and native context.</text><rect x="44" y="164" width="1352" height="110" rx="14" fill="#edf3f5" stroke="#d5e3e5"/><text x="67" y="200" font-size="20" fill="#203238" font-weight="600">Native installation starts the service</text><text x="67" y="237" font-size="16" fill="#63767d" font-weight="400">Claude Desktop extension or Claude Code plugin → stdio MCP adapter → discover or start this user’s local bridge.</text><rect x="44" y="300" width="366" height="636" rx="14" fill="#eef3f7" stroke="#d5e3e5"/><text x="67" y="341" font-size="23" fill="#203238" font-weight="600">01  Your application</text><text x="67" y="371" font-size="15" fill="#63767d" font-weight="400">OpenAI SDK · Pydantic AI · Console</text><rect x="512" y="300" width="416" height="636" rx="14" fill="#e8f3ee" stroke="#d5e3e5"/><text x="535" y="341" font-size="23" fill="#203238" font-weight="600">02  Signature Agent Bridge</text><text x="535" y="371" font-size="15" fill="#63767d" font-weight="400">One authenticated API and durable queue</text><rect x="1030" y="300" width="366" height="636" rx="14" fill="#f6eee7" stroke="#d5e3e5"/><text x="1053" y="341" font-size="23" fill="#203238" font-weight="600">03  Official Claude Code</text><text x="1053" y="371" font-size="15" fill="#63767d" font-weight="400">User-owned subscription and runtime</text><rect x="63" y="401" width="328" height="157" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="86" y="437" font-size="20" fill="#203238" font-weight="600">Submit or manage</text><text x="86" y="474" font-size="16" fill="#63767d" font-weight="400">/v1/chat/completions</text><text x="86" y="501" font-size="16" fill="#63767d" font-weight="400">Messages + bridge/&lt;profile&gt;</text><text x="86" y="528" font-size="16" fill="#63767d" font-weight="400">Bearer token + idempotency key</text><rect x="531" y="401" width="378" height="157" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="554" y="437" font-size="20" fill="#203238" font-weight="600">Accept and schedule</text><text x="554" y="474" font-size="16" fill="#63767d" font-weight="400">Validate caller, profile, and schemas</text><text x="554" y="501" font-size="16" fill="#63767d" font-weight="400">Commit job + event + request key</text><text x="554" y="528" font-size="16" fill="#63767d" font-weight="400">Claim an exclusive worker attempt</text><path d="M391 479H527" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="427" y="458" font-size="13" fill="#14756d" font-weight="600">HTTPS</text><rect x="1049" y="401" width="328" height="157" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="1072" y="437" font-size="20" fill="#203238" font-weight="600">Inference execution</text><text x="1072" y="474" font-size="16" fill="#63767d" font-weight="400">Native tools disabled</text><text x="1072" y="501" font-size="16" fill="#63767d" font-weight="400">Return a structured answer</text><text x="1072" y="528" font-size="16" fill="#63767d" font-weight="400">or client function requests</text><path d="M909 479H1045" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="950" y="458" font-size="13" fill="#14756d" font-weight="600">stdin</text><rect x="1049" y="579" width="328" height="157" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="1072" y="615" font-size="20" fill="#203238" font-weight="600">Native agent execution</text><text x="1072" y="652" font-size="16" fill="#63767d" font-weight="400">Profile tools + named subagents</text><text x="1072" y="679" font-size="16" fill="#63767d" font-weight="400">Native bypass enabled</text><text x="1072" y="706" font-size="16" fill="#63767d" font-weight="400">Own sessions and compaction</text><rect x="531" y="579" width="378" height="157" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="554" y="615" font-size="20" fill="#203238" font-weight="600">Coordinate and validate</text><text x="554" y="652" font-size="16" fill="#63767d" font-weight="400">Bound execution and process lifetime</text><text x="554" y="679" font-size="16" fill="#63767d" font-weight="400">Pause on quota; retain recovery state</text><text x="554" y="706" font-size="16" fill="#63767d" font-weight="400">Validate output and record usage</text><path d="M909 657H1045" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="948" y="636" font-size="13" fill="#14756d" font-weight="600">agent</text><rect x="63" y="605" width="328" height="157" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="86" y="641" font-size="20" fill="#203238" font-weight="600">Receive and continue</text><text x="86" y="678" font-size="16" fill="#63767d" font-weight="400">Completion JSON or buffered SSE</text><text x="86" y="705" font-size="16" fill="#63767d" font-weight="400">Run Python functions in this app</text><text x="86" y="732" font-size="16" fill="#63767d" font-weight="400">Send full history for the next turn</text><path d="M531 693H395" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="419" y="672" font-size="13" fill="#14756d" font-weight="600">response</text><rect x="531" y="757" width="378" height="130" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="554" y="793" font-size="20" fill="#203238" font-weight="600">Observe one shared record</text><text x="554" y="830" font-size="16" fill="#63767d" font-weight="400">/v1/bridge: jobs, workflows, controls</text><text x="554" y="857" font-size="16" fill="#63767d" font-weight="400">Audit + events → console and clients</text><rect x="1049" y="757" width="328" height="130" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="1072" y="793" font-size="20" fill="#203238" font-weight="600">Report observations</text><text x="1072" y="830" font-size="16" fill="#63767d" font-weight="400">Final result + session + usage</text><text x="1072" y="857" font-size="16" fill="#63767d" font-weight="400">Tool results + lifecycle events</text><path d="M1049 822H932" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="951" y="801" font-size="13" fill="#14756d" font-weight="600">events</text><text x="67" y="846" font-size="16" fill="#63767d" font-weight="400">Console and MCP tools manage</text><text x="67" y="873" font-size="16" fill="#63767d" font-weight="400">the same jobs and workflow runs.</text><rect x="44" y="960" width="1352" height="111" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="67" y="996" font-size="20" fill="#203238" font-weight="600">Host conversation mode</text><text x="67" y="1033" font-size="16" fill="#63767d" font-weight="400">bridge.execution=channel + background=true: the current host claims work through MCP and explicitly reports progress/completion.</text><path d="M44 1096H1396" fill="none" stroke="#d5e3e5" stroke-width="2.5"/><text x="44" y="1124" font-size="12" fill="#63767d" font-weight="400">Signature Management Consultants SLU · Apache 2.0</text><text x="1160" y="1124" font-size="12" fill="#14756d" font-weight="400">One user. Local ownership.</text></g></svg>
