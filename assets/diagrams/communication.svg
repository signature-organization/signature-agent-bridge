<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title description"><title id="title">Requests in. Validated answers and durable events out.</title><desc id="description">One API provides the OpenAI completion response and the execution controls needed by the management console.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto-start-reverse"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#14756d" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1440" height="1060" rx="20" fill="#f6f9fa" stroke="#f6f9fa"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="44" font-size="14" fill="#14756d" font-weight="600">SIGNATURE AGENT BRIDGE / SYSTEM DESIGN</text><text x="44" y="91" font-size="33" fill="#203238" font-weight="600">Requests in. Validated answers and durable events out.</text><text x="44" y="128" font-size="18" fill="#63767d" font-weight="400">One API provides the OpenAI completion response and the execution controls needed by the management console.</text><text x="66" y="207" font-size="22" fill="#203238" font-weight="600">Application</text><path d="M90 231V810" stroke="#ccdcdf" stroke-width="2" stroke-dasharray="5 7"/><text x="451" y="207" font-size="22" fill="#203238" font-weight="600">Bridge API</text><path d="M475 231V810" stroke="#ccdcdf" stroke-width="2" stroke-dasharray="5 7"/><text x="851" y="207" font-size="22" fill="#203238" font-weight="600">Durable queue</text><path d="M875 231V810" stroke="#ccdcdf" stroke-width="2" stroke-dasharray="5 7"/><text x="1261" y="207" font-size="22" fill="#203238" font-weight="600">Claude</text><path d="M1285 231V810" stroke="#ccdcdf" stroke-width="2" stroke-dasharray="5 7"/><path d="M90 275H475" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="102" y="259" font-size="16" fill="#203238" font-weight="400">POST /v1/chat/completions</text><path d="M475 338H875" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="487" y="322" font-size="16" fill="#203238" font-weight="400">Commit job + request key + event</text><path d="M875 401H1285" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="887" y="385" font-size="16" fill="#203238" font-weight="400">Claim and start / resume</text><path d="M1285 464H875" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="887" y="448" font-size="16" fill="#203238" font-weight="400">Structured result + usage + events</text><path d="M875 527H475" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="487" y="511" font-size="16" fill="#203238" font-weight="400">Persist outcome; validate response</text><path d="M475 590H90" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="102" y="574" font-size="16" fill="#203238" font-weight="400">200 JSON / OpenAI SSE + [DONE]</text><path d="M90 675H475" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="102" y="659" font-size="16" fill="#203238" font-weight="400">GET /v1/bridge/events + cursor</text><path d="M475 738H90" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="102" y="722" font-size="16" fill="#203238" font-weight="400">Durable job / workflow notifications</text><path d="M90 803H475" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="102" y="787" font-size="16" fill="#203238" font-weight="400">/v1/bridge/* controls and workflows</text><rect x="718" y="592" width="650" height="150" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="741" y="628" font-size="20" fill="#203238" font-weight="600">Background execution</text><text x="741" y="665" font-size="16" fill="#63767d" font-weight="400">bridge.background=true → HTTP 202 job receipt on admission.</text><text x="741" y="692" font-size="16" fill="#63767d" font-weight="400">Work continues without a waiting request. Inspect the job in</text><text x="741" y="719" font-size="16" fill="#63767d" font-weight="400">the console or through /v1/bridge/jobs/{id}.</text><rect x="44" y="851" width="654" height="126" rx="14" fill="#e8f3ee" stroke="#d5e3e5"/><text x="67" y="887" font-size="20" fill="#203238" font-weight="600">Completion stream</text><text x="67" y="924" font-size="16" fill="#63767d" font-weight="400">Keepalive comments while Claude runs. Validated final chunks</text><text x="67" y="951" font-size="16" fill="#63767d" font-weight="400">carry text or tool calls. This is buffered output, not token deltas.</text><rect x="742" y="851" width="654" height="126" rx="14" fill="#eef3f7" stroke="#d5e3e5"/><text x="765" y="887" font-size="20" fill="#203238" font-weight="600">Orchestration stream</text><text x="765" y="924" font-size="16" fill="#63767d" font-weight="400">Persisted event IDs allow replay with Last-Event-ID.</text><text x="765" y="951" font-size="16" fill="#63767d" font-weight="400">Refresh state when retention has expired the saved cursor.</text><path d="M44 1004H1396" fill="none" stroke="#d5e3e5" stroke-width="2.5"/><text x="44" y="1032" font-size="12" fill="#63767d" font-weight="400">Signature Management Consultants SLU · Apache 2.0</text><text x="1160" y="1032" font-size="12" fill="#14756d" font-weight="400">One user. Local ownership.</text></g></svg>
