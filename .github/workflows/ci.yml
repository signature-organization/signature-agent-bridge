name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.3.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Verify Python SDK clients
        run: |
          python3 -m venv .client-venv
          .client-venv/bin/pip install -r tests/clients/requirements.txt
          BRIDGE_PYTHON="$PWD/.client-venv/bin/python" npm run test:clients
      - run: npm run test:browser
      - run: npm run build
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high

  packages:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        runner:
          [
            macos-15,
            macos-15-intel,
            ubuntu-24.04,
            ubuntu-24.04-arm,
            windows-2025,
          ]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.3.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package
      - run: npm run test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.runner }}
          path: |
            release/*.tar.gz
            release/*.mcpb
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified platform packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum *.tar.gz *.mcpb > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.mcpb SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --title "Signature Agent Bridge $RELEASE_TAG" --notes-file ../CHANGELOG.md --draft=false --latest
          else
            gh release create "$RELEASE_TAG" ./*.tar.gz ./*.mcpb SHA256SUMS --verify-tag --title "Signature Agent Bridge $RELEASE_TAG" --notes-file ../CHANGELOG.md
          fi
