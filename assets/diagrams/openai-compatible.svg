<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1036" viewBox="0 0 1440 1036" role="img" aria-labelledby="title description"><title id="title">OpenAI-compatible calls. Explicit tool ownership.</title><desc id="description">Inference returns validated function requests to the caller; native agent execution is an explicit bridge option.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto-start-reverse"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#14756d" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1440" height="1036" rx="20" fill="#f6f9fa" stroke="#f6f9fa"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="44" font-size="14" fill="#14756d" font-weight="600">SIGNATURE AGENT BRIDGE / SYSTEM DESIGN</text><text x="44" y="91" font-size="33" fill="#203238" font-weight="600">OpenAI-compatible calls. Explicit tool ownership.</text><text x="44" y="128" font-size="18" fill="#63767d" font-weight="400">Inference returns validated function requests to the caller; native agent execution is an explicit bridge option.</text><rect x="44" y="172" width="366" height="570" rx="14" fill="#eef3f7" stroke="#d5e3e5"/><rect x="512" y="172" width="416" height="570" rx="14" fill="#e8f3ee" stroke="#d5e3e5"/><rect x="1030" y="172" width="366" height="570" rx="14" fill="#f6eee7" stroke="#d5e3e5"/><text x="68" y="214" font-size="18" fill="#536e7d" font-weight="600">APPLICATION PROCESS</text><text x="536" y="214" font-size="18" fill="#14756d" font-weight="600">LOCAL BRIDGE SERVICE</text><text x="1054" y="214" font-size="18" fill="#9a6138" font-weight="600">CLAUDE PROCESS</text><rect x="63" y="244" width="328" height="185" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="86" y="280" font-size="20" fill="#203238" font-weight="600">1. Ask the next turn</text><text x="86" y="317" font-size="16" fill="#63767d" font-weight="400">OpenAI SDK / OpenAIChatModel</text><text x="86" y="344" font-size="16" fill="#63767d" font-weight="400">Messages + function definitions</text><text x="86" y="371" font-size="16" fill="#63767d" font-weight="400">base_url: http://localhost:8766/v1</text><text x="86" y="398" font-size="16" fill="#63767d" font-weight="400">api_key: your scoped sab_ token</text><rect x="531" y="244" width="378" height="185" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="554" y="280" font-size="20" fill="#203238" font-weight="600">2. Admit and dispatch</text><text x="554" y="317" font-size="16" fill="#63767d" font-weight="400">POST /v1/chat/completions</text><text x="554" y="344" font-size="16" fill="#63767d" font-weight="400">One profile, queue, and scheduler</text><text x="554" y="371" font-size="16" fill="#63767d" font-weight="400">Persist request and native session</text><text x="554" y="398" font-size="16" fill="#63767d" font-weight="400">Disable native tools for inference</text><rect x="1049" y="244" width="328" height="185" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="1072" y="280" font-size="20" fill="#203238" font-weight="600">3. Produce structured output</text><text x="1072" y="317" font-size="16" fill="#63767d" font-weight="400">Use the official subscription login</text><text x="1072" y="344" font-size="16" fill="#63767d" font-weight="400">Choose answer or function calls</text><text x="1072" y="371" font-size="16" fill="#63767d" font-weight="400">Return observed usage</text><text x="1072" y="398" font-size="16" fill="#63767d" font-weight="400">Never execute client functions</text><path d="M391 332H527" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M909 332H1045" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="63" y="492" width="328" height="185" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="86" y="528" font-size="20" fill="#203238" font-weight="600">5. Run the Python function</text><text x="86" y="565" font-size="16" fill="#63767d" font-weight="400">Pydantic AI validates and executes</text><text x="86" y="592" font-size="16" fill="#63767d" font-weight="400">the requested application function.</text><text x="86" y="619" font-size="16" fill="#63767d" font-weight="400">Append tool result to full history.</text><text x="86" y="646" font-size="16" fill="#63767d" font-weight="400">Make the next completion request.</text><rect x="531" y="492" width="378" height="185" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="554" y="528" font-size="20" fill="#203238" font-weight="600">4. Validate before returning</text><text x="554" y="565" font-size="16" fill="#63767d" font-weight="400">Check function names + JSON args</text><text x="554" y="592" font-size="16" fill="#63767d" font-weight="400">Check required structured output</text><text x="554" y="619" font-size="16" fill="#63767d" font-weight="400">Return tool_calls with stable IDs</text><text x="554" y="646" font-size="16" fill="#63767d" font-weight="400">or final text / JSON / buffered SSE</text><path d="M1049 402H995V529H932" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="964" y="464" font-size="13" fill="#14756d" font-weight="600">result</text><path d="M531 582H395" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M228 677V716H461V389H527" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="245" y="708" font-size="13" fill="#14756d" font-weight="600">next model turn</text><text x="1053" y="517" font-size="15" fill="#9a6138" font-weight="600">NO NATIVE TOOLS</text><text x="1053" y="552" font-size="17" fill="#63767d" font-weight="400">No Bash, filesystem, MCP,</text><text x="1053" y="580" font-size="17" fill="#63767d" font-weight="400">or Agent execution in inference.</text><text x="1053" y="627" font-size="17" fill="#63767d" font-weight="400">Claude requests your function;</text><text x="1053" y="655" font-size="17" fill="#63767d" font-weight="400">your application runs it.</text><rect x="44" y="780" width="654" height="166" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="67" y="816" font-size="20" fill="#203238" font-weight="600">Need native coding or subagents?</text><text x="67" y="853" font-size="16" fill="#63767d" font-weight="400">Use the same endpoint with bridge.execution=&quot;agent&quot;.</text><text x="67" y="880" font-size="16" fill="#63767d" font-weight="400">The selected profile controls Claude’s tools and named agents.</text><text x="67" y="907" font-size="16" fill="#63767d" font-weight="400">background=true returns a durable job receipt immediately.</text><rect x="742" y="780" width="654" height="166" rx="14" fill="#fff" stroke="#d5e3e5"/><text x="765" y="816" font-size="20" fill="#203238" font-weight="600">One console for every execution</text><text x="765" y="853" font-size="16" fill="#63767d" font-weight="400">/v1/bridge/jobs → state, history, pause/resume, and cancel</text><text x="765" y="880" font-size="16" fill="#63767d" font-weight="400">/v1/bridge/workflow-runs → sequential templates</text><text x="765" y="907" font-size="16" fill="#63767d" font-weight="400">/v1/bridge/events → replayable orchestration notifications</text><path d="M44 980H1396" fill="none" stroke="#d5e3e5" stroke-width="2.5"/><text x="44" y="1008" font-size="12" fill="#63767d" font-weight="400">Signature Management Consultants SLU · Apache 2.0</text><text x="1160" y="1008" font-size="12" fill="#14756d" font-weight="400">One user. Local ownership.</text></g></svg>
