<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title description"><title id="title">Orchestrate the work. Preserve the checkpoints.</title><desc id="description">Workflow steps advance sequentially; Claude manages subagents inside each owned execution.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#14756d" stroke-width="1.4"/></marker><marker id="arrowCopper" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#b97545" stroke-width="1.4"/></marker></defs><rect width="1280" height="730" rx="20" fill="#f7f9fa"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="50" fill="#14756d" font-size="15" font-weight="600">Signature Agent Bridge</text><text x="42" y="96" fill="#203238" font-size="31" font-weight="600">Orchestrate the work. Preserve the checkpoints.</text><text x="42" y="128" fill="#657780" font-size="16" font-weight="400">Workflow steps advance sequentially; Claude manages subagents inside each owned execution.</text><rect x="48" y="208" width="240" height="116" rx="14" fill="#fff" stroke="#dbe6e7"/><rect x="48" y="226" width="4" height="25" rx="2" fill="#14756d"/><text x="72" y="245" fill="#203238" font-size="20" font-weight="600">Workflow snapshot</text><text x="72" y="278" fill="#657780" font-size="16" font-weight="400">Validated inputs + profiles</text><text x="72" y="303" fill="#657780" font-size="16" font-weight="400">Immutable step definitions</text>
<rect x="361" y="208" width="240" height="116" rx="14" fill="#fff" stroke="#dbe6e7"/><rect x="361" y="226" width="4" height="25" rx="2" fill="#14756d"/><text x="385" y="245" fill="#203238" font-size="20" font-weight="600">Research</text><text x="385" y="278" fill="#657780" font-size="16" font-weight="400">One durable job</text><text x="385" y="303" fill="#657780" font-size="16" font-weight="400">Native Claude session</text>
