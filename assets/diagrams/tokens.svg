<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title description"><title id="title">Two tokens, two different responsibilities.</title><desc id="description">The private owner token opens local administration. The owner issues scoped bridge tokens to applications. Official Claude login remains separate.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#14756d" stroke-width="1.4"/></marker></defs><rect width="1440" height="880" rx="20" fill="#f7f9fa"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="46" font-size="15" fill="#14756d" font-weight="600">Signature Agent Bridge / Operator guides</text><text x="44" y="96" font-size="32" fill="#203238" font-weight="600">Two tokens, two different responsibilities.</text><text x="44" y="132" font-size="18" fill="#657780" font-weight="400">The owner manages the bridge. Each application receives only its intended access.</text><rect x="44" y="188" width="390" height="218" rx="15" fill="#eef3f7" stroke="#d5e2e5"/><text x="68" y="225" font-size="21" fill="#203238" font-weight="600">1. Start the local bridge</text><text x="68" y="262" font-size="16" fill="#657780" font-weight="400">Desktop/Code loads its MCP adapter.</text><text x="68" y="289" font-size="16" fill="#657780" font-weight="400">The listener creates owner.token</text><text x="68" y="316" font-size="16" fill="#657780" font-weight="400">inside this user's private data directory.</text><text x="68" y="343" font-size="16" fill="#657780" font-weight="400">No Claude credential is copied.</text><rect x="524" y="188" width="392" height="218" rx="15" fill="#e8f3ee" stroke="#d5e2e5"/><text x="548" y="225" font-size="21" fill="#203238" font-weight="600">2. Open the console</text><text x="548" y="262" font-size="16" fill="#657780" font-weight="400">Copy owner.token locally.</text><text x="548" y="289" font-size="16" fill="#657780" font-weight="400">Paste it into the Bridge token field.</text><text x="548" y="316" font-size="16" fill="#657780" font-weight="400">Diagnostics → Client access</text><text x="548" y="343" font-size="16" fill="#657780" font-weight="400">Choose a client name and profiles.</text><rect x="1006" y="188" width="390" height="218" rx="15" fill="#f6eee7" stroke="#d5e2e5"/><text x="1030" y="225" font-size="21" fill="#203238" font-weight="600">3. Save the client token</text><text x="1030" y="262" font-size="16" fill="#657780" font-weight="400">Create token returns a sab_ value once.</text><text x="1030" y="289" font-size="16" fill="#657780" font-weight="400">Store it in the application's secrets.</text><text x="1030" y="316" font-size="16" fill="#657780" font-weight="400">The bridge stores only its hash.</text><text x="1030" y="343" font-size="16" fill="#657780" font-weight="400">Keep the owner token for administration.</text><path d="M434 298H520" stroke="#14756d" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="455" y="279" font-size="14" fill="#14756d" font-weight="600">Owner</text><path d="M916 298H1002" stroke="#14756d" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="938" y="279" font-size="14" fill="#14756d" font-weight="600">Create</text><rect x="44" y="494" width="640" height="220" rx="15" fill="#fff" stroke="#d5e2e5"/><text x="68" y="531" font-size="21" fill="#203238" font-weight="600">Owner access</text><text x="68" y="568" font-size="16" fill="#657780" font-weight="400">Manage templates, profiles through local configuration,</text><text x="68" y="595" font-size="16" fill="#657780" font-weight="400">service dispatch, hosts, and scoped application tokens.</text><text x="68" y="622" font-size="16" fill="#657780" font-weight="400">Inspect every local job and workflow.</text><text x="68" y="649" font-size="16" fill="#657780" font-weight="400">The owner console is a privileged local control surface.</text><rect x="744" y="494" width="652" height="220" rx="15" fill="#fff" stroke="#d5e2e5"/><text x="768" y="531" font-size="21" fill="#203238" font-weight="600">Application access</text><text x="768" y="568" font-size="16" fill="#657780" font-weight="400">Send Authorization: Bearer sab_… on REST and SSE.</text><text x="768" y="595" font-size="16" fill="#657780" font-weight="400">Scopes: read, submit, control, workflows.</text><text x="768" y="622" font-size="16" fill="#657780" font-weight="400">Only assigned profiles and this principal's jobs are accessible.</text><text x="768" y="649" font-size="16" fill="#657780" font-weight="400">Revocation invalidates requests and active event streams.</text><path d="M1202 406V488" stroke="#14756d" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="1225" y="451" font-size="14" fill="#14756d" font-weight="600">Bearer header</text><text x="44" y="780" font-size="17" fill="#14756d" font-weight="600">Claude subscription login stays with the official Claude Code executable. A bridge token never authenticates to Anthropic.</text><path d="M44 828H1396" stroke="#dbe6e7"/><text x="44" y="854" font-size="12" fill="#657780" font-weight="400">Signature Management Consultants SLU · Apache 2.0</text></g></svg>
