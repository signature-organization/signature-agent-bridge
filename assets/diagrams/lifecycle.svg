<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title description"><title id="title">Pause with context. Continue with intent.</title><desc id="description">The job, its attempts, and the native Claude session have separate responsibilities.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#14756d" stroke-width="1.4"/></marker><marker id="arrowCopper" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#b97545" stroke-width="1.4"/></marker></defs><rect width="1280" height="730" rx="20" fill="#f7f9fa"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="50" fill="#14756d" font-size="15" font-weight="600">Signature Agent Bridge</text><text x="42" y="96" fill="#203238" font-size="31" font-weight="600">Pause with context. Continue with intent.</text><text x="42" y="128" fill="#657780" font-size="16" font-weight="400">The job, its attempts, and the native Claude session have separate responsibilities.</text><rect x="50" y="200" width="240" height="115" rx="14" fill="#fff" stroke="#dbe6e7"/><rect x="50" y="218" width="4" height="25" rx="2" fill="#14756d"/><text x="74" y="237" fill="#203238" font-size="20" font-weight="600">Queued</text><text x="74" y="270" fill="#657780" font-size="16" font-weight="400">Admitted to the local queue</text><text x="74" y="295" fill="#657780" font-size="16" font-weight="400">No execution started</text>
<rect x="390" y="200" width="270" height="115" rx="14" fill="#fff" stroke="#dbe6e7"/><rect x="390" y="218" width="4" height="25" rx="2" fill="#14756d"/><text x="414" y="237" fill="#203238" font-size="20" font-weight="600">Running</text><text x="414" y="270" fill="#657780" font-size="16" font-weight="400">Exclusive fenced attempt</text><text x="414" y="295" fill="#657780" font-size="16" font-weight="400">Native session + child tasks</text>
<rect x="940" y="200" width="280" height="115" rx="14" fill="#fff" stroke="#dbe6e7"/><rect x="940" y="218" width="4" height="25" rx="2" fill="#14756d"/><text x="964" y="237" fill="#203238" font-size="20" font-weight="600">Succeeded</text><text x="964" y="270" fill="#657780" font-size="16" font-weight="400">Result saved with messages</text><text x="964" y="295" fill="#657780" font-size="16" font-weight="400">Next workflow step may start</text>
<path d="M290 257H390" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="310" y="242" fill="#14756d" font-size="14" font-weight="400">claim</text>
<path d="M660 257H940" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="712" y="241" fill="#14756d" font-size="15" font-weight="400">terminal result</text>
<rect x="390" y="404" width="270" height="135" rx="14" fill="#fff" stroke="#dbe6e7"/><rect x="390" y="422" width="4" height="25" rx="2" fill="#b97545"/><text x="414" y="441" fill="#203238" font-size="20" font-weight="600">Paused</text><text x="414" y="474" fill="#657780" font-size="16" font-weight="400">Operator or provider limit</text><text x="414" y="499" fill="#657780" font-size="16" font-weight="400">Session ID retained</text><text x="414" y="524" fill="#657780" font-size="16" font-weight="400">No new tool execution</text>
<path d="M478 315V404" fill="none" stroke="#b97545" stroke-width="2.5" marker-end="url(#arrowCopper)"/><text x="287" y="364" fill="#9b663d" font-size="15" font-weight="400">stop + persist</text>
<path d="M582 404V315" fill="none" stroke="#14756d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="603" y="363" fill="#14756d" font-size="15" font-weight="400">resume same session</text>
<rect x="50" y="414" width="240" height="125" rx="14" fill="#fff" stroke="#dbe6e7"/><rect x="50" y="432" width="4" height="25" rx="2" fill="#b97545"/><text x="74" y="451" fill="#203238" font-size="20" font-weight="600">Compaction</text><text x="74" y="484" fill="#657780" font-size="16" font-weight="400">Claude owns its summary</text><text x="74" y="509" fill="#657780" font-size="16" font-weight="400">Bridge records the boundary</text>
<path d="M160 414V350H390" fill="none" stroke="#b97545" stroke-width="2.5" marker-end="url(#arrowCopper)" stroke-dasharray="5 5"/>
<rect x="940" y="414" width="280" height="125" rx="14" fill="#fff" stroke="#dbe6e7"/><rect x="940" y="432" width="4" height="25" rx="2" fill="#b97545"/><text x="964" y="451" fill="#203238" font-size="20" font-weight="600">Interrupted / failed</text><text x="964" y="484" fill="#657780" font-size="16" font-weight="400">Reconcile external actions</text><text x="964" y="509" fill="#657780" font-size="16" font-weight="400">Explicit retry → new session</text>
<path d="M660 290H790V472H940" fill="none" stroke="#b97545" stroke-width="2.5" marker-end="url(#arrowCopper)"/>
<text x="390" y="590" fill="#14756d" font-size="16" font-weight="600">Known quota reset: bounded automatic resume after the provider timestamp.</text>
<text x="390" y="620" fill="#657780" font-size="16" font-weight="400">Unknown reset or unavailable session: operator review; no blind replay.</text>
<path d="M42 682H1238" stroke="#dbe6e7"/><text x="42" y="708" fill="#657780" font-size="12" font-weight="400">Signature Management Consultants SLU · Apache 2.0</text><text x="1080" y="708" fill="#14756d" font-size="12" font-weight="400">Local by design</text></g></svg>
