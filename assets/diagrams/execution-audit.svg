<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
<title id="title">From tool execution to a durable audit</title><desc id="desc">Claude emits full tool payloads. The bridge correlates and persists observations. The console and API expose commands, file contents, diffs, and immutable exports with clear provenance.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#14756d" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="1050" fill="#f6f9f8"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
<text x="48" y="48" fill="#14756d" font-size="13" font-weight="700" letter-spacing="3">SIGNATURE / EXECUTION VISIBILITY</text>
<text x="48" y="100" fill="#203238" font-size="37" font-weight="650">See the action. Keep the evidence.</text>
<text x="48" y="137" fill="#667b80" font-size="19">Full emitted payloads, explicit outcomes, and one durable record for every observed execution.</text>
<rect x="48" y="184" width="388" height="500" rx="15" fill="#fff" stroke="#dbe6e3"/><rect x="67" y="204" width="36" height="30" rx="15" fill="#e6f2ed" stroke="#e6f2ed"/><text x="76" y="225" font-size="12" fill="#14756d" font-weight="650">01</text><text x="117" y="226" font-size="22" fill="#203238" font-weight="650">Claude execution</text><text x="71" y="261" font-size="16" fill="#667b80" font-weight="400">Source of tool observations</text><rect x="526" y="184" width="388" height="500" rx="15" fill="#fff" stroke="#dbe6e3"/><rect x="545" y="204" width="36" height="30" rx="15" fill="#e6f2ed" stroke="#e6f2ed"/><text x="554" y="225" font-size="12" fill="#14756d" font-weight="650">02</text><text x="595" y="226" font-size="22" fill="#203238" font-weight="650">Local bridge</text><text x="549" y="261" font-size="16" fill="#667b80" font-weight="400">Correlation + durable persistence</text><rect x="1004" y="184" width="388" height="500" rx="15" fill="#fff" stroke="#dbe6e3"/><rect x="1023" y="204" width="36" height="30" rx="15" fill="#e6f2ed" stroke="#e6f2ed"/><text x="1032" y="225" font-size="12" fill="#14756d" font-weight="650">03</text><text x="1073" y="226" font-size="22" fill="#203238" font-weight="650">Console &amp; clients</text><text x="1027" y="261" font-size="16" fill="#667b80" font-weight="400">Inspect + retrieve + export</text><text x="71" y="310" font-size="19" fill="#14756d" font-weight="650">Tool request</text><text x="71" y="341" font-size="17" fill="#203238" font-weight="400">ID + name + complete input</text><text x="71" y="374" font-size="17" fill="#203238" font-weight="400">Write → submitted file content</text><text x="71" y="405" font-size="17" fill="#203238" font-weight="400">Edit → before / after fragments</text><text x="71" y="436" font-size="17" fill="#203238" font-weight="400">Bash → command and arguments</text><text x="71" y="491" font-size="19" fill="#14756d" font-weight="650">Tool result</text><text x="71" y="522" font-size="17" fill="#203238" font-weight="400">Complete content + error status</text><text x="71" y="553" font-size="17" fill="#203238" font-weight="400">stdout / stderr, patches, originals</text><text x="71" y="597" font-size="16" fill="#667b80" font-weight="400">Parent ID identifies a subagent.</text><text x="71" y="626" font-size="16" fill="#667b80" font-weight="400">Only emitted information is available.</text><text x="549" y="310" font-size="19" fill="#14756d" font-weight="650">Match the execution</text><text x="549" y="341" font-size="17" fill="#203238" font-weight="400">Job → fenced attempt → tool ID</text><text x="549" y="374" font-size="17" fill="#203238" font-weight="400">Preserve session and parent IDs</text><rect x="546" y="404" width="348" height="128" rx="15" fill="#edf5f1" stroke="#d6e7dd"/><text x="565" y="435" font-size="19" fill="#203238" font-weight="650">SQLite transaction</text><text x="565" y="467" font-size="16" fill="#203238" font-weight="400">Immutable audit entries + payloads</text><text x="565" y="498" font-size="16" fill="#203238" font-weight="400">Current tool and file observations</text><text x="549" y="576" font-size="16" fill="#9a683e" font-weight="600">No result at stop → outcome unknown</text><text x="549" y="612" font-size="16" fill="#667b80" font-weight="400">Commit first. Notify through SSE.</text><text x="1027" y="310" font-size="19" fill="#14756d" font-weight="650">Activity</text><text x="1027" y="341" font-size="17" fill="#203238" font-weight="400">Expand commands and tool results</text><text x="1027" y="374" font-size="17" fill="#203238" font-weight="400">Inspect IDs, timing, and provenance</text><text x="1027" y="422" font-size="19" fill="#14756d" font-weight="650">Files</text><text x="1027" y="453" font-size="17" fill="#203238" font-weight="400">Read / write contents + edit diffs</text><text x="1027" y="486" font-size="17" fill="#203238" font-weight="400">Reported targets and outcomes</text><text x="1027" y="535" font-size="19" fill="#14756d" font-weight="650">Audit API &amp; JSON export</text><text x="1027" y="566" font-size="17" fill="#203238" font-weight="400">Full payloads behind job read access</text><text x="1027" y="599" font-size="17" fill="#203238" font-weight="400">Fixed cursor gives a stable snapshot</text><text x="1027" y="630" font-size="16" fill="#667b80" font-weight="400">Metadata first; details on demand</text><path d="M440 453H516" fill="none" stroke="#14756d" stroke-width="2" marker-end="url(#arrow)"/><path d="M918 453H994" fill="none" stroke="#14756d" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="714" width="866" height="223" rx="15" fill="#fff" stroke="#dbe6e3"/><text x="71" y="753" font-size="21" fill="#203238" font-weight="650">Whose execution is it?</text><text x="71" y="793" font-size="17" fill="#14756d" font-weight="600">Native Claude tools</text><text x="305" y="793" font-size="17" fill="#203238" font-weight="400">Requests + provider-reported results + known file targets</text><text x="71" y="839" font-size="17" fill="#14756d" font-weight="600">Application functions</text><text x="305" y="839" font-size="17" fill="#203238" font-weight="400">Requested by Claude; executed and reported by the client</text><text x="71" y="885" font-size="17" fill="#14756d" font-weight="600">Host conversation</text><text x="305" y="885" font-size="17" fill="#203238" font-weight="400">Job lifecycle only; internal tool activity is not visible</text><rect x="938" y="714" width="454" height="223" rx="15" fill="#f3eee7" stroke="#e9dfd1"/><text x="961" y="753" font-size="20" fill="#77583f" font-weight="650">A precise record, with honest limits</text><text x="961" y="791" font-size="16" fill="#775f4c" font-weight="400">SSE retention does not delete the audit.</text><text x="961" y="822" font-size="16" fill="#775f4c" font-weight="400">Shell side effects do not prove file changes.</text><text x="961" y="853" font-size="16" fill="#775f4c" font-weight="400">Contents can contain secrets: protect access.</text><text x="961" y="884" font-size="16" fill="#775f4c" font-weight="400">Local records are not tamper-proof evidence.</text><path d="M48 980H1392" stroke="#dbe6e3"/><text x="48" y="1015" font-size="13" fill="#667b80" font-weight="400">© 2026 Signature Management Consultants SLU · Apache 2.0</text><text x="1100" y="1015" font-size="13" fill="#14756d" font-weight="400">Your workspace. Observable work.</text></g></svg>
