<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title description"><title id="title">Plan, build, review, repair, verify.</title><desc id="description">Five sequential bridge jobs with planner and reviewer subagents. The bridge controls checkpoints, while official Claude Code executes the work.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#14756d" stroke-width="1.4"/></marker></defs><rect width="1440" height="880" rx="20" fill="#f7f9fa"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="46" font-size="15" fill="#14756d" font-weight="600">Signature Agent Bridge / Operator guides</text><text x="44" y="96" font-size="32" fill="#203238" font-weight="600">Plan, build, review, repair, verify.</text><text x="44" y="132" font-size="18" fill="#657780" font-weight="400">One reusable template. Five durable jobs. Native delegation inside the relevant stages.</text><rect x="44" y="192" width="248" height="200" rx="15" fill="#e8f3ee" stroke="#d5e2e5"/><text x="68" y="229" font-size="21" fill="#203238" font-weight="600">1. Plan</text><text x="68" y="266" font-size="16" fill="#657780" font-weight="400">Delegate inspection</text><text x="68" y="293" font-size="16" fill="#657780" font-weight="400">to the planner agent.</text><text x="68" y="320" font-size="16" fill="#657780" font-weight="400">Return paths and checks.</text><path d="M292 287H316" stroke="#14756d" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="0" y="0" font-size="14" fill="#14756d" font-weight="600"></text><rect x="320" y="192" width="248" height="200" rx="15" fill="#fff" stroke="#d5e2e5"/><text x="344" y="229" font-size="21" fill="#203238" font-weight="600">2. Implement</text><text x="344" y="266" font-size="16" fill="#657780" font-weight="400">Apply the requested</text><text x="344" y="293" font-size="16" fill="#657780" font-weight="400">change in the project.</text><text x="344" y="320" font-size="16" fill="#657780" font-weight="400">Run relevant checks.</text><path d="M568 287H592" stroke="#14756d" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="0" y="0" font-size="14" fill="#14756d" font-weight="600"></text><rect x="596" y="192" width="248" height="200" rx="15" fill="#e8f3ee" stroke="#d5e2e5"/><text x="620" y="229" font-size="21" fill="#203238" font-weight="600">3. Review</text><text x="620" y="266" font-size="16" fill="#657780" font-weight="400">Delegate inspection</text><text x="620" y="293" font-size="16" fill="#657780" font-weight="400">to the reviewer agent.</text><text x="620" y="320" font-size="16" fill="#657780" font-weight="400">Return concrete findings.</text><path d="M844 287H868" stroke="#14756d" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="0" y="0" font-size="14" fill="#14756d" font-weight="600"></text><rect x="872" y="192" width="248" height="200" rx="15" fill="#fff" stroke="#d5e2e5"/><text x="896" y="229" font-size="21" fill="#203238" font-weight="600">4. Repair</text><text x="896" y="266" font-size="16" fill="#657780" font-weight="400">Investigate findings.</text><text x="896" y="293" font-size="16" fill="#657780" font-weight="400">Correct real defects.</text><text x="896" y="320" font-size="16" fill="#657780" font-weight="400">Preserve unrelated work.</text><path d="M1120 287H1144" stroke="#14756d" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="0" y="0" font-size="14" fill="#14756d" font-weight="600"></text><rect x="1148" y="192" width="248" height="200" rx="15" fill="#e8f3ee" stroke="#d5e2e5"/><text x="1172" y="229" font-size="21" fill="#203238" font-weight="600">5. Verify</text><text x="1172" y="266" font-size="16" fill="#657780" font-weight="400">Run documented checks.</text><text x="1172" y="293" font-size="16" fill="#657780" font-weight="400">Inspect the final diff.</text><text x="1172" y="320" font-size="16" fill="#657780" font-weight="400">Report observed results.</text><rect x="44" y="454" width="652" height="200" rx="15" fill="#fff" stroke="#d5e2e5"/><text x="68" y="491" font-size="21" fill="#203238" font-weight="600">The bridge owns the sequence</text><text x="68" y="528" font-size="16" fill="#657780" font-weight="400">Each step starts after the previous job succeeds.</text><text x="68" y="555" font-size="16" fill="#657780" font-weight="400">The template and inputs are saved with this run.</text><text x="68" y="582" font-size="16" fill="#657780" font-weight="400">Pause holds the current step and blocks advancement.</text><text x="68" y="609" font-size="16" fill="#657780" font-weight="400">Completed steps are preserved when the run resumes.</text><rect x="744" y="454" width="652" height="200" rx="15" fill="#fff" stroke="#d5e2e5"/><text x="768" y="491" font-size="21" fill="#203238" font-weight="600">Claude owns the execution</text><text x="768" y="528" font-size="16" fill="#657780" font-weight="400">Each job gets a dedicated official Claude Code process.</text><text x="768" y="555" font-size="16" fill="#657780" font-weight="400">Agent delegates to the configured planner or reviewer.</text><text x="768" y="582" font-size="16" fill="#657780" font-weight="400">Native task events and results return to the bridge.</text><text x="768" y="609" font-size="16" fill="#657780" font-weight="400">The model uses the user's own subscription login.</text><rect x="44" y="690" width="1352" height="102" rx="15" fill="#eef3f7" stroke="#d5e2e5"/><text x="68" y="727" font-size="21" fill="#203238" font-weight="600">One explicit project directory</text><text x="68" y="764" font-size="16" fill="#657780" font-weight="400">Every stage receives the same absolute project path. Use a dedicated checkout; each job otherwise has its own working directory.</text><path d="M44 828H1396" stroke="#dbe6e7"/><text x="44" y="854" font-size="12" fill="#657780" font-weight="400">Signature Management Consultants SLU · Apache 2.0</text></g></svg>
